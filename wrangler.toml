name = "eth-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

[placement]
mode = "smart"

[limits]
cpu_ms = 5000

[vars]
CHAIN_ID = "11155111"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432/evm_sepolia"

[env.sepolia]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "4c98d632c1e5426eab8bece278d2abc6" }
]
vars = { CHAIN_ID = "11155111" }
routes = [
    { pattern = "eth-sepolia-api.ekubo.org", custom_domain = true }
]


[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "04a121d0804b4451b6cdf894c9b61b56" }
]
vars = { CHAIN_ID = "1" }
routes = [
    { pattern = "eth-mainnet-api.ekubo.org", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.