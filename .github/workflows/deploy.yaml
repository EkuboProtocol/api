name: Deploy

on:
  push:
    branches:
      - main

concurrency: deploy-cf

jobs:
  deploy:
    strategy:
      # A failed preview deploy must not cancel the production one.
      fail-fast: false
      matrix:
        include:
          - deploy_env: prod
          # ekubo-api-preview.ekubo.workers.dev, with wallet to X linking
          # on the preview identity D1.
          - deploy_env: preview

    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    # Only the upstream repo holds the Cloudflare credentials; without this a
    # fork's first push to main fails the job instead of simply skipping it.
    if: github.repository == 'EkuboProtocol/api'
    steps:
      - uses: actions/checkout@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun ci

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            deploy --env ${{ matrix.deploy_env }} --minify
