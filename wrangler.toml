name = "ekubo-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true
usage_model = "bundled"

[vars]
STARKNET_CHAIN_ID = "0x534e5f4d41494e"
# only used for running the api locally
PG_CONNECTION_STRING="postgresql://postgres:postgres@localhost:5432"

[env.goerli]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "ea0b41549b16437d8d89fdb769395f43" }
]
vars = { STARKNET_CHAIN_ID = "0x534e5f474f45524c49" }

[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "da493ecfaf3f40f4985fa006d3c574a6" }
]
vars = { STARKNET_CHAIN_ID = "0x534e5f4d41494e" }
