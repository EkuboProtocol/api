name: Update Token Image

on:
  workflow_dispatch:
    inputs:
      token_symbol:
        description: "Token symbol (e.g., BTC, ETH)"
        required: true
        type: string
      image_url:
        description: "URL of the token image to upload"
        required: true
        type: string

jobs:
  update-token-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Upload image to Cloudflare
        id: upload_image
        run: |
          RESPONSE=$(curl --request POST \
            https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/images/v1 \
            --header "Authorization: Bearer ${{ secrets.CF_IMAGES_API_TOKEN }}" \
            --form "url=${{ github.event.inputs.image_url }}" \
            --form "requireSignedURLs=false")

          echo "RESPONSE: $RESPONSE"

          # Extract the image ID from the response
          IMAGE_ID=$(echo $RESPONSE | jq -r '.result.id')

          if [ "$IMAGE_ID" = "null" ] || [ -z "$IMAGE_ID" ]; then
            echo "Error: Failed to upload image to Cloudflare"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "Image uploaded successfully. ID: $IMAGE_ID"
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update logos.json
        run: |
          TOKEN_SYMBOL="${{ github.event.inputs.token_symbol }}"
          IMAGE_ID="${{ steps.upload_image.outputs.image_id }}"
          IMAGE_URL="https://imagedelivery.net/0xPAQaDtnQhBs8IzYRIlNg/${IMAGE_ID}/logo"

          echo "Adding $TOKEN_SYMBOL with URL: $IMAGE_URL"

          # Check if logos.json exists
          LOGOS_FILE="src/routes/meta/defaults/logos.json"
          if [ ! -f "$LOGOS_FILE" ]; then
            echo "Error: $LOGOS_FILE not found"
            exit 1
          fi

          # Read the current file and add the new entry
          jq --arg symbol "$TOKEN_SYMBOL" \
             --arg url "$IMAGE_URL" \
             '. + {($symbol): $url}' "$LOGOS_FILE" > tmp.json && mv tmp.json "$LOGOS_FILE"

          # Format the file with prettier
          npx prettier --write "$LOGOS_FILE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "feat: add ${{ github.event.inputs.token_symbol }} token image"
          title: "Add ${{ github.event.inputs.token_symbol }} token image"
          body: |
            Added token image for ${{ github.event.inputs.token_symbol }}

            - Uploaded image from ${{ github.event.inputs.image_url }} to Cloudflare
            - Updated logos.json with the new image URL

            This PR was created automatically by the Update Token Image workflow.
          branch: "token-image/${{ github.event.inputs.token_symbol }}"
          delete-branch: true
          base: main
