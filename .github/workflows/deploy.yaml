name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    strategy:
      matrix:
        include:
          - network_name: mainnet
          - network_name: goerli
          - network_name: sepolia

    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check typescript
        run: npm run check-ts

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: |
            deploy --env ${{ matrix.network_name }} --minify