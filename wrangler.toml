name = "ekubo-api"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"

[placement]
mode = "smart"

[limits]
cpu_ms = 5000

[vars]
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432/postgres"

[env.prod]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "c6bd83f26cc840e3aa09870557f286f4" },
]
routes = [{ pattern = "prod-api.ekubo.org", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
