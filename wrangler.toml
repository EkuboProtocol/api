name = "eth-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

[placement]
mode = "smart"

[limits]
cpu_ms = 5000

[vars]
CHAIN_ID = "1"
ORACLE_ADDRESS = "0x51d02A5948496a67827242EaBc5725531342527C"
TWAMM_ADDRESS = "0xd4279c050da1f5c5b2830558c7a08e57e12b54ec"
MEV_RESIST_ADDRESS = "0x553a2EFc570c9e104942cEC6aC1c18118e54C091"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432/eth_mainnet"

[env.sepolia]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "1fc62b7bd745410ea6da4849cf2def2e" }
]
vars = { CHAIN_ID = "11155111", ORACLE_ADDRESS = "0x51d02A5948496a67827242EaBc5725531342527C", TWAMM_ADDRESS = "0xd4279c050da1f5c5b2830558c7a08e57e12b54ec", MEV_RESIST_ADDRESS = "0x553a2EFc570c9e104942cEC6aC1c18118e54C091" }
routes = [
    { pattern = "eth-sepolia-api.ekubo.org", custom_domain = true }
]

[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "04a121d0804b4451b6cdf894c9b61b56" }
]
vars = { CHAIN_ID = "1", ORACLE_ADDRESS = "0x51d02A5948496a67827242EaBc5725531342527C", TWAMM_ADDRESS = "0xd4279c050da1f5c5b2830558c7a08e57e12b54ec", MEV_RESIST_ADDRESS = "0x553a2EFc570c9e104942cEC6aC1c18118e54C091" }
routes = [
    { pattern = "eth-mainnet-api.ekubo.org", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
