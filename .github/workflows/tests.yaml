name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Format, lint, types and unit tests
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun ci

      # These checks only read the source tree, so they run at the same time.
      # Each one runs to completion even when another fails, so one push
      # reports every kind of problem at once.
      - parallel:
          - name: Format
            run: bun run format:check

          - name: Lint
            run: bun run lint

          - name: Type check
            run: bun run typecheck

          - name: Unit tests
            run: bun test
