name = "ekubo-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "<ignored>", preview_id = "<ignored>" },
]

[limits]
cpu_ms = 5000

[vars]
ETH_TOKEN_ADDRESS = "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7"
STRK_TOKEN_ADDRESS = "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"
STARKNET_CHAIN_ID = "0x534e5f4d41494e"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432"

[env.sepolia]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "b51db39ca7b34229960e75e048be113b" }
]
kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "5612d9a16e6d43fea983af957f2ee69c" },
]
vars = { STARKNET_CHAIN_ID = "0x534e5f5345504f4c4941", ETH_TOKEN_ADDRESS = "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7", STRK_TOKEN_ADDRESS = "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d" }

[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "997ae180b930431b9f6f7bee121ffc3d" }
]
kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "5612d9a16e6d43fea983af957f2ee69c" },
]
vars = { STARKNET_CHAIN_ID = "0x534e5f4d41494e", ETH_TOKEN_ADDRESS = "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7", STRK_TOKEN_ADDRESS = "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d" }
