name = "eth-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

[placement]
mode = "smart"

[limits]
cpu_ms = 5000

[vars]
CHAIN_ID = "1"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432/eth_sepolia"

[env.sepolia]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "1fc62b7bd745410ea6da4849cf2def2e" }
]
vars = { CHAIN_ID = "11155111" }
routes = [
    { pattern = "eth-sepolia-api.ekubo.org", custom_domain = true }
]


[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "04a121d0804b4451b6cdf894c9b61b56" }
]
vars = { CHAIN_ID = "1" }
routes = [
    { pattern = "eth-mainnet-api.ekubo.org", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.