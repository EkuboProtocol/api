name = "ekubo-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "<ignored>", preview_id = "<ignored>" },
]

[limits]
cpu_ms = 200

[vars]
ETH_TOKEN_ADDRESS = "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7"
STARKNET_CHAIN_ID = "0x534e5f4d41494e"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432"

[env.goerli]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "1ff94d1260d0442895a1ab0ee1f9e79a" }
]
kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "8edf0811f4ac443b8ce778bf509899b3" },
]
vars = { STARKNET_CHAIN_ID = "0x534e5f474f45524c49", ETH_TOKEN_ADDRESS = "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7" }

