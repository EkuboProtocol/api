name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    strategy:
      matrix:
        include:
          - name: testnet
            rpc_url: testnet
            chain_id: "0x534e5f474f45524c49"
          - name: testnet2
            rpc_url: testnet2
            chain_id: "0x534e5f474f45524c4932"
          - name: mainnet
            rpc_url: mainnet
            chain_id: "0x534e5f4d41494e"

    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Publish
        uses: cloudflare/wrangler-action@2.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: |
            deploy --name ekubo_renderer_${{ matrix.name }}
              --var STARKNET_RPC_URL:${{ matrix.rpc_url }}
              --var STARKNET_CHAIN_ID:${{ matrix.chain_id }}