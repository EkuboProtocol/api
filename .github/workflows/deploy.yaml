name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    strategy:
      matrix:
        include:
          - network_name: mainnet
            chain_id: "0x534e5f4d41494e"
          - network_name: goerli
            chain_id: "0x534e5f474f45524c49"
            kv_namespace_id: d58f8ea846e54fdca2b237f50717b60e

    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Publish
        uses: cloudflare/wrangler-action@2.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: |
            deploy --name nft_metadata_${{ matrix.network_name }} --var STARKNET_CHAIN_ID:${{ matrix.chain_id }}