name = "ekubo-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

[limits]
cpu_ms = 200

[vars]
STARKNET_CHAIN_ID = "0x534e5f4d41494e"
RPC_URL = "https://starknet-mainnet.infura.io/v3/20b154288df84d3db74dc5cd439f9f04"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432"

[env.goerli]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "3e875b5cbae54e4883db3854d814770b" }
]
kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "8edf0811f4ac443b8ce778bf509899b3" }
]
vars = { STARKNET_CHAIN_ID = "0x534e5f474f45524c49", RPC_URL = "https://starknet-goerli.infura.io/v3/20b154288df84d3db74dc5cd439f9f04" }

[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "9e5de62791af4b58bf77c200812dc269" }
]
kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "5612d9a16e6d43fea983af957f2ee69c" }
]
vars = { STARKNET_CHAIN_ID = "0x534e5f4d41494e", RPC_URL = "https://starknet-mainnet.infura.io/v3/684f6e596f134e2d8f86e181e88dcb94" }
