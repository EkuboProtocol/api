name = "ekubo-api"
main = "src/index.ts"
compatibility_date = "2023-03-14"
node_compat = true

kv_namespaces = [
    { binding = "TOKEN_LOGOS_KV", id = "<ignored>", preview_id = "<ignored>" },
]

[limits]
cpu_ms = 5000

[vars]
STARKNET_CHAIN_ID = "0x534e5f4d41494e"
# only used for running the api locally
PG_CONNECTION_STRING = "postgresql://postgres:postgres@localhost:5432/mainnet"

[env.sepolia]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "c12069dcd06847d0acfe22a686cd8540" }
]
vars = { STARKNET_CHAIN_ID = "0x534e5f5345504f4c4941" }

[env.mainnet]
hyperdrive = [
    { binding = "HYPERDRIVE", id = "b8e8dbd6a4b642afbed28edd892c0ad8" }
]
vars = { STARKNET_CHAIN_ID = "0x534e5f4d41494e" }
