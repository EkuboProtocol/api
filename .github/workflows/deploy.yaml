name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    strategy:
      matrix:
        include:
          - network_name: goerli
            rpc_url: "https://starknet-goerli.infura.io/v3/5c6b5f24259f42b6b8ec9932b08a3816"
            chain_id: "0x534e5f474f45524c49"
          - network_name: goerli2
            rpc_url: "https://starknet-goerli2.infura.io/v3/5c6b5f24259f42b6b8ec9932b08a3816"
            chain_id: "0x534e5f474f45524c4932"
          - network_name: mainnet
            rpc_url: "https://starknet-mainnet.infura.io/v3/5c6b5f24259f42b6b8ec9932b08a3816"
            chain_id: "0x534e5f4d41494e"

    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Publish
        uses: cloudflare/wrangler-action@2.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: |
            deploy --name nft_metadata_${{ matrix.network_name }} --var STARKNET_RPC_URL:${{ matrix.rpc_url }} --var STARKNET_CHAIN_ID:${{ matrix.chain_id }}